apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "springboot-api.fullname" . }}
  labels:
    {{- include "springboot-api.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "springboot-api.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "springboot-api.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: springboot-api

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: APP_NAME
              value: {{ .Values.config.appName | quote }}

            - name: ENVIRONMENT
              value: {{ .Values.config.environment | quote }}

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "springboot-api.fullname" . }}-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "springboot-api.fullname" . }}-secret
                  key: DB_PASSWORD

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}