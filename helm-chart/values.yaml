replicaCount: 3

image:
  repository: sukshmajain/springboot-api
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

config:
  appName: "Spring Boot Kubernetes API"
  environment: "development"

secret:
  username: ""
  password: ""

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10

  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5